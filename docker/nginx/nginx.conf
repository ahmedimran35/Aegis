events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP/3 (QUIC) is INTENTIONALLY DISABLED.
    # Mounting alt-svc triggers QUIC handshake on UDP/443 which bypasses
    # standard H2 smuggling checks (Tlsmw.h2_frames). Re-enable only
    # after we have a QUIC-aware parser in middleware.

    # --- HTTP server (cleartext, port 80) ---
    # P-FIX: redirect ALL cleartext requests to HTTPS. Serving the
    # dashboard or API over HTTP allows an active network attacker to
    # modify the HTML/JS and steal session data or perform privileged
    # actions even with Secure cookies (the script runs in the dashboard
    # origin and can use the user's session while they're logged in).
    # A separate explicit path is preserved for ACME http-01 challenges
    # if the operator enables them.
    server {
        listen 80;
        server_name _;

        # ACME http-01 challenge passthrough (only if a path is configured)
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        # Everything else: 301 to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS server (TLS, port 443) ---
    # HSTS is set ONLY here, where the connection is actually TLS-protected.
    # The HSTS preload directive is opt-in via the AEGIS_HSTS_PRELOAD env
    # (see api/router.go) — operators must submit to https://hstspreload.org
    # before enabling it.
    #
    # The TLS cert + key are expected at /etc/nginx/certs (mounted via
    # docker-compose). For local dev, use mkcert or self-signed:
    #   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem \
    #     -days 365 -nodes -subj "/CN=localhost"
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # P-FIX (H-1): Mozilla "intermediate" TLS 1.2 cipher list with
        # AEAD-only suites + CHACHA20-POLY1305 fallback for ARM clients.
        # Disables 3DES/RC4/MD5 entirely; !eNULL blocks unauthenticated
        # suites; TLS 1.3 cipher choice is governed by the Go runtime, not
        # this directive.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!aNULL:!eNULL:!MD5:!3DES:!RC4;
        ssl_prefer_server_ciphers on;
        # P-FIX (M-20): explicit session-resumption limits. Disable
        # session tickets (forward-secret rotation friendly) and cap
        # session lifetime at 1 day.
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # P-FIX: stricter CSP. Removed `ws:` (only `wss:` allowed over
        # HTTPS), added base-uri / object-src / form-action / frame-ancestors
        # restrictions, and explicit X-Content-Type-Options already
        # above. `style-src 'unsafe-inline'` remains because the React
        # build injects a small inline style block; tightening this
        # requires a nonce pipeline change.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self' data:" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        client_max_body_size 10m;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location = /ping {
            limit_req zone=health burst=5 nodelay;
            proxy_pass http://aegis:8080/ping;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto "https";
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://aegis:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto "https";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            client_body_timeout 30s;
            client_header_timeout 15s;
            send_timeout 30s;
        }
    }
}
