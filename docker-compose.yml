version: "3.8"

services:
  nginx:
    # P-FIX (M-32): build nginx from a custom Dockerfile so the dashboard
    # SPA is baked into the image at build time (via the same node+nginx
    # multi-stage build as the aegis image). This eliminates the
    # dashboard-mount-staleness class of bugs where the host's
    # dashboard/dist is older than what aegis was built against.
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    # P-FIX (M-25): run the nginx master process as the unprivileged
    # `nginx` user (UID 101 in alpine), not root. The parent PID stays
    # as PID 1 (root) only for the lifetime of the entrypoint bind,
    # which is the standard pattern for nginx:alpine.
    user: "101:101"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # P-FIX: mount TLS certs so the 443 listener has a real certificate.
      # Generate a self-signed cert for dev:
      #   mkdir -p docker/nginx/certs
      #   openssl req -x509 -newkey rsa:4096 -keyout docker/nginx/certs/key.pem \
      #     -out docker/nginx/certs/cert.pem -days 365 -nodes -subj "/CN=localhost"
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - aegis
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  aegis:
    build:
      context: .
      dockerfile: docker/aegis/Dockerfile
      args:
        - VERSION=${AEGIS_VERSION:-dev}
        - BUILD_TIME=${AEGIS_BUILD_TIME:-unknown}
        - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AEGIS_DATABASE_URL=${AEGIS_DATABASE_URL:?Set AEGIS_DATABASE_URL in .env}
      - AEGIS_REDIS_URL=${AEGIS_REDIS_URL:?Set AEGIS_REDIS_URL in .env}
      - AEGIS_UPSTREAM_URL=${AEGIS_UPSTREAM_URL:?Set AEGIS_UPSTREAM_URL in .env}
      - AEGIS_NIM_API_KEY=${NIM_API_KEY:-}
      - AEGIS_JWT_SECRET=${AEGIS_JWT_SECRET:?Set AEGIS_JWT_SECRET in .env}
      - AEGIS_SCIM_TOKEN=${AEGIS_SCIM_TOKEN:-}
      - AEGIS_TOTP_KEY=${AEGIS_TOTP_KEY:-}
      - AEGIS_HSTS_PRELOAD=${AEGIS_HSTS_PRELOAD:-false}
      - AEGIS_ABUSEIPDB_API_KEY=${AEGIS_ABUSEIPDB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped
    healthcheck:
      # The Aegis heartbeat is /ping (chi middleware). Health check uses
      # localhost since nginx proxies the same path.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.2
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
