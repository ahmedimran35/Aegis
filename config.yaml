server:
  listen: ":8080"
  cors_origins:
    - "http://localhost:8080"
    - "http://localhost:5173"
    - "${AEGIS_PUBLIC_URL}"
upstream:
  url: "${AEGIS_UPSTREAM_URL}"
ai:
  provider: "ollama"
  nim:
    api_key: ""
    model: "meta/llama-3.1-8b-instruct"
    base_url: "https://integrate.api.nvidia.com/v1"
    timeout: "10s"
  ollama:
    url: "http://localhost:11434"
    model: "llama3:8b"
    timeout: "5s"
  failover:
    threshold: 0.9
    window: "5m"
rate_limit:
  default: "100/min"
redis:
  url: "${AEGIS_REDIS_URL}"
database:
  url: "${AEGIS_DATABASE_URL}"
logging:
  batch_size: 100
  flush_interval: "1s"
auth:
  jwt_secret: "${AEGIS_JWT_SECRET}"
bot_detection:
  mode: "log"
alerts:
  webhook_url: ""
  min_severity: "medium"
tls:
  enabled: false
  domains: []
  email: ""
  cache_dir: "/var/lib/aegis/certs"
  # http_listen: ":80"  # REMOVED — cleartext HTTP listener removed. Configure
  # HTTPS termination via real reverse proxy (nginx/Caddy) in front of Aegis,
  # or set tls.enabled=true to let Aegis obtain a cert via ACME.
allowlist:
  enabled: false
session:
  enabled: true
  cookie_name: "aegis_session"
  ttl: "24h"
geoip:
  enabled: true
  db_path: "/var/lib/aegis/GeoLite2-Country.mmdb"
  blocked: []
  allowed: []
ddos:
  max_concurrent_conns: 1000
  max_conns_per_ip: 50
  max_new_conns_per_second: 100
  max_reqs_per_conn: 1000
siem:
  enabled: false
  type: "syslog"
  syslog_addr: "localhost:514"
  file_path: "/var/log/aegis/siem.json"
  format: "json"
  min_severity: "medium"
honeypot:
  enabled: true
  paths:
    - "/admin"
    - "/wp-login.php"
    - "/.env"
    - "/phpmyadmin"
    - "/xmlrpc.php"
    - "/wp-admin"
    - "/administrator"
    - "/.git/config"
    - "/server-status"
    - "/actuator"
rules:
  paranoia_level: 1
  anomaly_threshold: 10
response_inspect:
  enabled: true
brute_force:
  enabled: true
  max_attempts: 5
  lock_duration: "15m"
  window_duration: "5m"
libinjection:
  enabled: true
  threshold: 2
body_inspect:
  enabled: true
  inspect_json: true
  inspect_form: true
  inspect_multipart: true
  inspect_xml: true
  inspect_text: true
reputation:
  enabled: false
  abuseipdb_api_key: ""
  auto_block_threshold: 80
graphql:
  enabled: true
  max_depth: 10
  max_complexity: 100
  block_introspection: true
  allowed_operations: []
ato:
  enabled: true
  login_paths:
    - "/api/v1/auth/login"
  max_attempts_per_ip: 10
  max_usernames_per_ip: 5
  max_ips_per_username: 3
  lockout_duration: "15m"
slow_dos:
  enabled: true
  window_1m: 120
  window_5m: 500
  window_15m: 1500
  action: "challenge"
behavioral_bot:
  enabled: true
  score_threshold: 5
bola:
  enabled: true
  anomaly_threshold: 0.3
credential_stuffing:
  enabled: true
  window: "10m"
  min_ips: 5
  min_attempts: 20
csp_nonce:
  enabled: true
shadow_api:
  enabled: true
  min_req_count: 10
ja3:
  # JA3 fingerprint is a coarse hash of (TLS ServerName, User-Agent, etc.)
  # not a real TLS ClientHello fingerprint — see internal/middleware/ja3.go.
  # Disabled by default: trivially spoofable, never auto-block on it.
  enabled: false
